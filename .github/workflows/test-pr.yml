name: Test PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun i --ignore-scripts --frozen-lockfile

      - name: Run Biome
        run: bun biome ci

      - name: Typecheck
        run: bun typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check exports
        run: bun check-exports
